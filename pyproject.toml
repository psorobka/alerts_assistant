[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.alerts_assistant"]

[tool.coverage.run]
source = ["custom_components/alerts_assistant"]

[tool.coverage.report]
show_missing = true
